<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>加入电台</title>
  <style>
    :root { color-scheme: dark; --bg:#080b12; --panel:#111722; --line:#263142; --text:#f3f7ff; --muted:#8e9bb0; --accent:#7ee7c7; --danger:#ff8f8f; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 20% 0%, #18243a, transparent 45%), var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(520px,100%); padding:30px; border:1px solid var(--line); border-radius:24px; background:linear-gradient(145deg,rgba(255,255,255,.06),transparent 40%),var(--panel); box-shadow:0 30px 100px rgba(0,0,0,.5); }
    .kicker { margin:0 0 8px; color:var(--accent); font-size:10px; font-weight:800; letter-spacing:.18em; }
    h1 { margin:0; font-size:30px; letter-spacing:-.04em; }
    p { color:var(--muted); }
    form { display:flex; gap:8px; margin-top:22px; }
    input { flex:1; min-width:0; padding:13px 15px; border:1px solid var(--line); border-radius:13px; background:#0a0f18; color:var(--text); font:inherit; text-transform:uppercase; letter-spacing:.08em; }
    input:focus { outline:2px solid rgba(126,231,199,.35); border-color:var(--accent); }
    button { padding:13px 20px; border:0; border-radius:13px; background:var(--accent); color:#06110e; font:inherit; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { min-height:24px; margin:12px 0 0; font-size:12px; }
    #status[data-tone="error"] { color:var(--danger); }
    #result { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
    #result.hidden { display:none; }
    #stationName { margin:0; font-size:22px; }
    #stationMeta { margin:4px 0 14px; font-size:12px; }
    #enter { display:inline-flex; padding:11px 18px; border-radius:12px; background:var(--accent); color:#06110e; font-weight:800; text-decoration:none; }
    .note { margin-top:20px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-size:12px; color:var(--muted); }
    @media (max-width:520px) { main { padding:22px; } form { flex-direction:column; } h1 { font-size:26px; } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">RADIO DIRECTORY</p>
    <h1>加入电台</h1>
    <p>输入 16 位邀请码，进入对应的电台。</p>

    <form id="joinForm" autocomplete="off">
      <input id="code" maxlength="24" placeholder="7K4M9Q2XJ8R5T3WA" aria-label="邀请码" required>
      <button id="submit" type="submit">加入</button>
    </form>

    <p id="status" role="status"></p>

    <section id="result" class="hidden" aria-live="polite">
      <h2 id="stationName"></h2>
      <p id="stationMeta"></p>
      <a id="enter" href="#" rel="noopener noreferrer">进入电台</a>
    </section>

    <p class="note">邀请码只用于定位电台。管理员 token 不会经过此页面。</p>
  </main>
  <script src="/join.js"></script>
</body>
</html>
