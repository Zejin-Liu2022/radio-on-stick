<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>猫娘电台</title>
  <link rel="icon" href="/placeholder.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=52">
</head>
<body>
  <div class="bg-layer" id="bgLayerA" aria-hidden="true"></div>
  <div class="bg-layer" id="bgLayerB" aria-hidden="true"></div>
  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grid-lines"></div>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <h1 id="stationName">猫娘电台</h1>
        <p id="stationSubtitle" class="station-subtitle"></p>
      </div>
      <div class="top-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换主题" title="切换主题">
          <svg class="icon stroke-icon icon-sun hidden" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon stroke-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>
        </button>
        <button id="bgPickerBtn" class="icon-btn" type="button" aria-label="本机背景图" title="本机背景图">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="9.5" r="1.4"/><path d="m5.5 17 4.3-4.2 3.1 3 2.2-2.1 3.4 3.3"/></svg>
        </button>
        <input id="bgLocalInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
        <button class="listener-pill" id="listenerCount" type="button" aria-label="查看在听的人" title="查看在听的人">1 人</button>
        <button id="nicknameBtn" class="icon-btn" type="button" aria-label="设置昵称" title="设置昵称">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20c.5-3.4 3-5.3 6.8-5.3s6.3 1.9 6.8 5.3H5.2Z"/></svg>
        </button>
        <div class="sync-pill visually-hidden" id="syncStatus" data-state="connecting">连接中</div>
      </div>
    </header>

    <div id="noticeBar" class="notice hidden"></div>

    <div class="stage" id="stage">
      <div class="pages" id="pages">
        <section class="playback-page" id="playbackPage">
          <div class="playback-layout">
            <div class="cover-column">
              <button id="coverButton" class="cover-button" type="button" aria-label="展开歌词">
                <img id="cover" src="/placeholder.svg" alt="当前曲目封面">
                <span class="source-badge" id="sourceBadge">待机</span>
              </button>
              <div class="track-meta">
                <h2 id="title">等待开播</h2>
                <div class="track-detail">
                  <span id="artist" class="artist">--</span>
                  <span id="album" class="album">--</span>
                </div>
              </div>

              <div class="current-lyric" id="currentLyric">
                <span id="currentLyricText"></span>
                <span id="currentLyricTrans" class="current-lyric-trans"></span>
              </div>

              <div id="nextTrackInfo" class="next-track-info empty">
                <img id="nextCover" src="/placeholder.svg" alt="">
                <div class="next-track-copy">
                  <span class="next-track-label">下一首</span>
                  <span id="nextTitle" class="next-track-title">暂无下一首</span>
                  <span id="nextArtist" class="next-track-artist">等待队列</span>
                </div>
              </div>
            </div>

            <div class="lyrics-panel" id="lyricsPanel">
              <div class="lyrics-scroll" id="lyricsScroll">
                <div class="lyrics" id="lyrics">
                  <p class="lyrics-empty">等待开播</p>
                </div>
              </div>
              <button id="translationToggle" class="icon-btn toggle-btn" type="button" aria-pressed="true" aria-label="双语歌词" title="双语歌词">
                <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M8 4v2c0 3.5-1.5 6-4 7.5M5.5 9H11M13 20l3.2-9h2L21 20M14.3 16h5.4"/></svg>
              </button>
            </div>
          </div>

        </section>

        <section class="chat-page" id="chatPage">
          <div class="chat-head visually-hidden"><h2>留言</h2></div>
          <div class="chat-log">
            <div id="messageList" class="message-list">
              <p class="empty">还没有留言</p>
            </div>
          </div>
          <form id="messageForm" class="message-form live" autocomplete="off">
            <input id="messageInput" maxlength="200" placeholder="发个留言…">
            <button id="messageBtn" class="icon-btn send-btn" type="submit" aria-label="发送留言" title="发送留言">
              <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5 20 12 4 19.5l2-7.5-2-7.5Zm2 7.5h10"/></svg>
            </button>
          </form>
          <p id="messageStatus" class="form-status" role="status"></p>
        </section>
      </div>
    </div>

    <footer class="player-dock">
      <div class="dock-progress">
        <div class="progress" id="progressTrack" role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="position">00:00</span>
          <span id="duration">--:--</span>
        </div>
      </div>
      <div class="dock-controls">
        <button id="chatBtn" class="icon-btn dock-side-btn" type="button" aria-label="进入聊天" title="进入聊天">
          <svg class="icon stroke-icon icon-chat" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9l-4 3v-3H4v-11Z"/><path d="M8 9h8M8 12.5h5"/></svg>
          <svg class="icon stroke-icon icon-up hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <div class="center-controls">
          <button id="libraryBtn" class="icon-btn library-btn" type="button" aria-label="点歌与列表" title="点歌与列表">
            <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/><path d="M18 15v5m-2.5-2.5h5"/></svg>
            <span id="libraryBadge" class="badge hidden">0</span>
          </button>
          <button id="playBtn" class="play-btn" type="button" aria-label="播放">
            <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2Z"/></svg>
            <svg class="icon icon-pause hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h3.6v15H7zM13.4 4.5H17v15h-3.6z"/></svg>
          </button>
          <button id="voteSkipBtn" class="icon-btn vote-btn" type="button" aria-label="投票切歌" title="投票切歌" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h3.3v13H5zM11 5.5l8 6.5-8 6.5z"/></svg>
            <span id="voteInfo" class="badge hidden">0</span>
          </button>
        </div>
        <div class="volume dock-volume">
          <button id="muteBtn" class="icon-btn" type="button" aria-label="静音" title="静音">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2l4.3 3.5c.7.6 1.8.1 1.8-.8V6.8c0-.9-1.1-1.4-1.8-.8L7.2 9.5H4Zm12.1-1.9a6.2 6.2 0 0 1 0 8.8l1.4 1.4a8.2 8.2 0 0 0 0-11.6l-1.4 1.4Z"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
        </div>
      </div>
      <span id="audioMode" class="dock-status">等待音频</span>
    </footer>
  </div>

  <audio id="audio" preload="none"></audio>
  <audio id="audioB" preload="none"></audio>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>
  <aside id="libraryDrawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <h2 id="drawerTitle" class="visually-hidden">点歌与列表</h2>
    <form id="searchForm" class="drawer-search" autocomplete="off">
      <div class="search-input-wrap">
        <button id="searchCancelBtn" class="icon-btn search-cancel" type="button" aria-label="取消搜索" title="取消搜索">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <input id="searchInput" maxlength="500" placeholder="搜索歌名/歌手，或粘贴 B 站视频链接" aria-label="搜索歌曲或粘贴哔哩哔哩链接">
        <button id="searchBtn" class="icon-btn" type="submit" aria-label="搜索" title="搜索">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
        </button>
      </div>
      <button id="uploadBtn" class="icon-btn" type="button" aria-label="上传本地音频，支持 MP3/AAC/WAV/FLAC 等，最大 64MB" title="上传本地音频（MP3/AAC/WAV/FLAC 等，≤64MB）">
        <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8M5 20h14"/></svg>
      </button>
    </form>
    <input id="uploadInput" type="file" accept="audio/*,.mp3,.aac,.m4a,.ogg,.opus,.webm,.wav,.flac" hidden>
    <p id="searchStatus" class="form-status" role="status"></p>

    <div class="drawer-switch" id="queueHistorySwitch">
      <button id="viewQueueBtn" class="drawer-switch-btn active" type="button" aria-label="待播放" title="待播放">
        <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span class="drawer-switch-label">待播放</span>
        <span id="playlistCount" class="badge hidden">0</span>
      </button>
      <button id="viewHistoryBtn" class="drawer-switch-btn" type="button" aria-label="历史点歌" title="历史点歌">
        <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.7M4 4v4.7h4.7"/><path d="M12 8v4.5l3 2"/></svg>
        <span class="drawer-switch-label">历史点歌</span>
      </button>
    </div>

    <div class="drawer-body">
      <section id="searchResultsPanel" class="drawer-panel hidden">
        <div id="searchResults" class="search-results"></div>
      </section>
      <section id="queuePanel" class="drawer-panel">
        <div id="playlistList" class="playlist-list"></div>
      </section>
      <section id="historyPanel" class="drawer-panel hidden">
        <div id="historyList" class="playlist-list"></div>
      </section>
    </div>
  </aside>

  <div id="nicknameModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="nicknameTitle">
    <div class="modal-card">
      <p class="kicker">PROFILE</p>
      <h2 id="nicknameTitle">起个昵称喵</h2>
      <input id="nicknameInput" maxlength="16" autocomplete="nickname">
      <p id="nicknameStatus" class="form-status" role="status"></p>
      <div class="modal-actions">
        <button id="nicknameSave" class="icon-btn" type="button" aria-label="保存昵称" title="保存昵称">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="listenersModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="listenersTitle">
    <div class="modal-card listeners-card">
      <p class="kicker">LISTENERS</p>
      <h2 id="listenersTitle">正在听</h2>
      <p id="listenersSummary" class="modal-copy">0 人在听</p>
      <div id="listenersList" class="listener-list"></div>
      <div class="modal-actions">
        <button id="listenersClose" class="icon-btn" type="button" aria-label="关闭在听列表" title="关闭">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="bgLocalModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="bgLocalTitle">
    <div class="modal-card bg-local-card">
      <p class="kicker">LOCAL BACKGROUND</p>
      <h2 id="bgLocalTitle">本机背景</h2>
      <p class="modal-copy">仅保存在当前浏览器，最多 5 张；优先于歌曲封面背景。</p>
      <div id="bgLocalGallery" class="bg-local-gallery"></div>
      <p id="bgLocalStatus" class="form-status" role="status"></p>
      <div class="modal-actions bg-local-actions">
        <button id="bgLocalAdd" class="icon-btn" type="button" aria-label="添加背景图片" title="添加背景图片">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="bgLocalReset" class="icon-btn" type="button" aria-label="恢复歌曲封面背景" title="恢复歌曲封面背景">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.7M4 4v4.7h4.7"/></svg>
        </button>
        <button id="bgLocalSave" class="icon-btn" type="button" aria-label="完成" title="完成">
          <svg class="icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/mesh.js?v=8"></script>
  <script src="/app.js?v=59"></script>
</body>
</html>
